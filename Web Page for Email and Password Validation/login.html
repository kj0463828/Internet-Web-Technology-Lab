
<!DOCTYPE html>
<html>
<head>
    <title>Email Validation Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h2>Login Form</h2>

    <form id="loginForm">

        <label>Email Address:</label>

        <input type="text" id="email"
        placeholder="Enter Your Email" required>

        <label>Password:</label>

        <div class="password-box">

            <input type="password" id="password"
            placeholder="Enter Your Password" required>

            <button type="button" id="togglePassword"
            class="eye-btn" onclick="showPassword()">

                <svg id="eyeIcon" viewBox="0 0 24 24">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>

            </button>

        </div>

        <button type="submit">Login</button>

        <p id="result"></p>

    </form>

</div>


<script>

// Show and Hide Password

function showPassword() {

    let password = document.getElementById("password");
    let eyeIcon = document.getElementById("eyeIcon");

    if (password.type === "password") {

        password.type = "text";

        eyeIcon.innerHTML = `
        <path d="M3 3l18 18"/>
        <path d="M10.6 10.6a2 2 0 002.8 2.8"/>
        <path d="M9.9 5.2A11 11 0 0112 5c6.5 0 10 7 10 7a15 15 0 01-3.2 4.1"/>
        <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.5 0 2.8-.3 4-.9"/>
        `;

    } else {

        password.type = "password";

        eyeIcon.innerHTML = `
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
        <circle cx="12" cy="12" r="3"/>
        `;

    }

}


// Email and Password Validation

document.getElementById("loginForm").addEventListener("submit",

function(event) {

    event.preventDefault();

    let email = document.getElementById("email").value.trim();

    let password = document.getElementById("password").value;

    let result = document.getElementById("result");


    // Email Split

    let emailParts = email.split("@");

    if (emailParts.length !== 2) {

        result.innerHTML = "Invalid Email Format!";
        return;

    }


    // Username Validation

    let username = emailParts[0];

    let usernamePattern = /^[a-zA-Z0-9._%+-]+$/;

    if (username.length === 0 ||
        !usernamePattern.test(username)) {

        result.innerHTML = "Invalid Username Part!";
        return;

    }


    // Domain Validation

    let domain = emailParts[1];

    let domainPattern =
    /^[a-zA-Z0-9]+([.-][a-zA-Z0-9]+)*\.[a-zA-Z]{2,}$/;

    if (!domainPattern.test(domain)) {

        result.innerHTML = "Invalid Domain Name Part!";
        return;

    }


    // Strong Password Validation

    let passwordPattern =
    /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*]).{8,}$/;

    if (!passwordPattern.test(password)) {

        result.innerHTML =
        "Weak Password! Use Uppercase, Lowercase, Number, Special Character and minimum 8 characters.";

        return;

    }


    // Successful Login

    sessionStorage.setItem("email", email);

    window.location.href = "welcome.html";

});

</script>

</body>
</html>
